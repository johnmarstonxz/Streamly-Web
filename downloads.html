<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get Streamly</title>
<meta name="theme-color" content="#0e0a16">
<link rel="icon" href="icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--acc:#8b5cf6;--bg:#0e0a16;--sf:#1a1427;--sf2:#251d37;--tx:#f3effb;--tx2:#a69cbc;--line:rgba(255,255,255,.09)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(70% 38% at 50% -6%,rgba(139,92,246,.55),transparent 70%),radial-gradient(50% 30% at 100% 40%,rgba(139,92,246,.16),transparent 70%),var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:26px}
.top img{width:92px;height:92px;border-radius:22%;box-shadow:0 0 50px rgba(139,92,246,.6);animation:pop .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:0}}
h1{margin:6px 0 0;font-size:1.7rem}.top p{margin:0;color:var(--tx2);max-width:34ch}
.ver{font-size:.78rem;color:var(--tx2)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.card.rec{background:linear-gradient(135deg,rgba(139,92,246,.34),rgba(26,20,39,.9));border-color:rgba(139,92,246,.6);box-shadow:0 10px 40px rgba(139,92,246,.25)}
.ico{width:48px;height:48px;border-radius:14px;background:var(--sf2);display:grid;place-items:center;font-size:1.5rem;flex:none}
.info{flex:1;min-width:180px}.info b{display:block;font-size:1.05rem}.info small{color:var(--tx2);line-height:1.4;display:block;margin-top:3px}
.tag{display:inline-block;font-size:.68rem;padding:3px 9px;border-radius:99px;background:rgba(139,92,246,.3);color:#d8c8ff;margin-bottom:6px}
.btn{display:inline-block;background:linear-gradient(135deg,#8b5cf6,#c4b5fd);color:#fff;text-decoration:none;border:0;font:inherit;font-weight:600;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(139,92,246,.4);cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.alt{background:var(--sf2);box-shadow:none;color:var(--tx)}
h2{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);margin:26px 4px 10px}
details{width:100%}summary{cursor:pointer;color:var(--tx2);font-size:.85rem;margin-top:6px}details p{color:var(--tx2);font-size:.85rem;line-height:1.5;margin:8px 0 0}
.foot{text-align:center;color:var(--tx2);font-size:.8rem;margin-top:30px}.foot a{color:#c4b5fd}
</style>
</head>
