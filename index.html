<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streamly</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Streamly">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#07050c}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{--acc:#8b5cf6;--acc-rgb:139,92,246;--bg:#0e0a16;--sf:#1a1427;--sf2:#251d37;--tx:#f3effb;--tx2:#a69cbc;--line:rgba(255,255,255,.08);--hdr:rgba(14,10,22,.78);--nav:rgba(18,13,29,.94);--glow:.3;
position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg);color:var(--tx);font-size:.95rem}
#app[data-theme=dark]{--bg:#0d0d11;--sf:#18181f;--sf2:#23232c;--hdr:rgba(13,13,17,.8);--nav:rgba(18,18,24,.95)}
#app[data-theme=amoled]{--bg:#000;--sf:#0f0d14;--sf2:#1a1722;--hdr:rgba(0,0,0,.8);--nav:rgba(0,0,0,.96)}
#app[data-theme=light]{--bg:#f6f3fc;--sf:#fff;--sf2:#ece7f7;--tx:#1b1530;--tx2:#6b6285;--line:rgba(30,20,60,.1);--hdr:rgba(246,243,252,.85);--nav:rgba(255,255,255,.96)}
#app[data-theme=dark] .amb,#app[data-theme=light] .amb{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;transition:filter 1.2s ease}
.amb::before{content:"";position:absolute;left:50%;top:calc(min(92vw,480px)*-.46);width:min(92vw,480px);height:min(92vw,480px);transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.95) 0%,rgba(var(--acc-rgb),.6) 36%,rgba(var(--acc-rgb),.2) 62%,transparent 72%);filter:blur(14px);opacity:calc(.28 + var(--glow)*.62);animation:orb 6s ease-in-out infinite alternate}
.amb::after{content:"";position:absolute;right:-22vw;bottom:8%;width:min(60vw,320px);height:min(60vw,320px);border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.7) 0%,rgba(var(--acc-rgb),.25) 50%,transparent 70%);filter:blur(18px);opacity:calc(.1 + var(--glow)*.3);animation:orb2 8s ease-in-out infinite alternate}
@keyframes orb{to{transform:translateX(-50%) scale(1.08)}}
@keyframes orb2{to{transform:translate(-4vw,-3vh) scale(1.1)}}
#app.noanim *{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
.amb{position:absolute;inset:0;pointer-events:none;z-index:0;transition:filter 1.2s ease;
background:radial-gradient(90% 45% at 50% -8%,rgba(var(--acc-rgb),calc(.12 + var(--glow)*.55)),transparent 72%),radial-gradient(60% 30% at 100% 42%,rgba(var(--acc-rgb),calc(var(--glow)*.14)),transparent 70%)}
.amb.idle{filter:grayscale(1)}
.mb{position:absolute;top:0;bottom:0;width:34px;z-index:60;pointer-events:none;backdrop-filter:blur(var(--mbpx,0px));-webkit-backdrop-filter:blur(var(--mbpx,0px));-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent);opacity:var(--mbo,0)}
.mb.r{right:0;transform:scaleX(-1)}.mb.l{left:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}.content.nos{overflow:hidden}
.nav{display:flex;border-top:1px solid var(--line);background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.nav button{flex:1;display:grid;justify-items:center;gap:3px;padding:9px 0 8px;font-size:.68rem;color:var(--tx2);position:relative;transition:color .2s}
.nav button.on{color:var(--acc)}.nav button.on svg{filter:drop-shadow(0 0 8px rgba(var(--acc-rgb),.7))}
.nav .dot{position:absolute;top:7px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:#ff5a6e}
/* splash */
#splash{position:absolute;inset:0;z-index:999;background:radial-gradient(80% 50% at 50% 40%,#3a0a8f,#0a0712 72%);display:grid;place-content:center;justify-items:center;gap:16px;color:#fff;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.logo{filter:drop-shadow(0 0 22px rgba(139,92,246,.65))}
.ls .s{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.1s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ls .bx{transform-origin:48px 48px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4) rotate(-14deg);opacity:0}}
.sname{font-size:2.1rem;font-weight:700;display:flex}
.sname span{opacity:0;transform:translateY(12px);animation:lt .5s ease forwards}
@keyframes lt{to{opacity:1;transform:none}}
.stag{color:#b9a8e6;font-size:.85rem;opacity:0;animation:lt .6s 1.7s ease forwards}
/* gate */
.gate{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:14px;padding:28px;text-align:center}
.gate h1{margin:6px 0 0;font-size:1.5rem}.gate p{margin:0;color:var(--tx2);max-width:30ch}
.keyin{width:min(320px,80vw);text-align:center;letter-spacing:.14em;font-weight:600;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--tx);text-transform:uppercase}
.cta{background:linear-gradient(135deg,rgba(var(--acc-rgb),1),color-mix(in srgb,var(--acc) 55%,#fff));color:#fff;font-weight:600;border-radius:14px;padding:13px 22px;min-width:200px;box-shadow:0 8px 26px rgba(var(--acc-rgb),.35);transition:transform .15s,opacity .2s}
.cta:active{transform:scale(.97)}.cta[disabled]{opacity:.4;box-shadow:none}
.err{color:#ff7a8a;min-height:1.2em;font-size:.85rem}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* header/home */
.sticky{position:sticky;top:0;z-index:5;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:6px}
.hdr{display:flex;align-items:center;gap:8px;padding:0 14px;height:48px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:1.02rem}
.chip-s{margin-left:auto;display:flex;gap:6px}
.tag{font-size:.68rem;padding:3px 8px;border-radius:99px;background:rgba(var(--acc-rgb),.22);color:color-mix(in srgb,var(--acc) 60%,var(--tx))}
.tag.warn{background:rgba(255,120,90,.2);color:#ff9a82}
.search{display:flex;gap:10px;align-items:center;padding:6px 14px;height:54px}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:14px;padding:0 12px;height:42px;color:var(--tx2);border:1px solid var(--line)}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);height:100%}
.sbtn{color:var(--acc);font-weight:600;padding:8px 2px}
.feeds{display:flex;gap:22px;padding:8px 16px 0;height:44px;position:relative;z-index:5;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.sfix.pin{box-shadow:0 8px 20px rgba(0,0,0,.3)}
.sfix{will-change:transform;transition:box-shadow .2s;position:absolute;top:48px;left:0;right:0;height:54px;z-index:6;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#top{flex:none;position:relative;z-index:6;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mid{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.grid.hg{padding-top:58px}
.feeds button{padding:6px 0;color:var(--tx2);font-weight:600;position:relative}
.feeds button.on{color:var(--tx)}.feeds button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px rgba(var(--acc-rgb),.8)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:12px 14px 22px}
.card{min-width:0;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 200px}
.cv{position:relative;aspect-ratio:3/4.1;border-radius:16px;overflow:hidden;background:var(--sf2);box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.07);transition:transform .2s}
.card:active .cv{transform:scale(.96)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.lg{position:absolute;top:6px;right:6px;font-size:.66rem;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;padding:2px 8px;border-radius:99px}
.nw{position:absolute;top:6px;left:6px;font-size:.62rem;background:var(--acc);color:#fff;padding:2px 7px;border-radius:99px}
.card p{margin:6px 2px 0;font-size:.8rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:70px 30px;text-align:center;color:var(--tx2)}.empty b{display:block;color:var(--tx);font-size:1.05rem;margin-bottom:6px}
.pad{padding:14px}
h2.pt{margin:0;padding:16px 16px 6px;font-size:1.35rem}
.sub{color:var(--tx2);font-size:.82rem;padding:0 16px}
/* detail */
.detail{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:up .3s ease;font-size:.9rem}
@keyframes up{from{transform:translateY(5%);opacity:0}}
.detail.out{opacity:0;transition:opacity .2s}
.player{position:relative;aspect-ratio:16/9;background:#000;flex:none;overflow:hidden}
.player.fs{position:fixed;inset:0;z-index:500;aspect-ratio:auto;width:100%;height:100%}
.player .toast{bottom:64px}.player .shw{z-index:700}.player.fs .sh{max-width:480px;margin:0 auto;max-height:90%}
.player.fs.rot{inset:auto;top:0;left:100%;width:100vh;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg)}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:#07050c}
.art{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3) brightness(.7);transition:filter .4s}
.stage.playing .art{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.12) translate(3%,-2%)}}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
.plabel{position:absolute;left:12px;top:48px;font-size:.72rem;color:#ddd;display:grid;gap:2px;text-shadow:0 1px 6px #000;transition:opacity 1.6s ease}
.plabel.hide{opacity:0}
.plabel b{font-size:.95rem;color:#fff}
.fx{position:absolute;top:50%;transform:translateY(-50%) scale(.8);padding:14px 18px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.fx.l{left:12%}.fx.r{right:12%}.fx.on{opacity:1;transform:translateY(-50%) scale(1)}
.hold{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;opacity:0;transition:opacity .15s;pointer-events:none}.hold.on{opacity:1}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent 35%,transparent 60%,rgba(0,0,0,.7));opacity:0;transition:opacity 1.4s ease;pointer-events:none}
.ctl.show{opacity:1;transition:opacity .2s}.ctl *{pointer-events:auto}.ctl:not(.show) *{pointer-events:none!important}
.ctop{display:flex;align-items:center;gap:6px;padding:8px 8px 0}.ctitle{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ctitle{transition:opacity 1.6s ease}.ctitle.hide{opacity:0}
.cmid{display:flex;justify-content:center;align-items:center;gap:28px}
.cmid .big{width:56px;height:56px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.cmid .sk{font-size:.8rem;font-weight:600;background:rgba(255,255,255,.12);width:44px;height:44px}
.cbot{padding:0 10px 8px}
.seekrow{display:flex;align-items:center;gap:8px;font-size:.72rem}
.seek{flex:1;accent-color:var(--acc);height:20px}
.opts{display:none;justify-content:space-around;padding:2px 0 4px}
.fs .opts{display:flex}
.opts button{display:grid;justify-items:center;gap:2px;font-size:.68rem;padding:4px 8px}
.dscroll{flex:1;overflow-y:auto;padding:12px 14px 100px;scrollbar-width:none}
.dscroll::-webkit-scrollbar{display:none}
.dtitle{margin:0;font-size:1.2rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.dtitle small{font-weight:400;color:var(--tx2);font-size:.85rem}
.dtitle button{font-size:.8rem;color:var(--tx2);font-weight:400}
.meta{display:flex;align-items:center;gap:7px;color:var(--tx2);font-size:.8rem;margin:7px 0 12px;flex-wrap:wrap}.meta .st{color:#f5b73b;display:flex;gap:3px;align-items:center}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.pills button{display:flex;align-items:center;gap:6px;background:var(--sf);border-radius:99px;padding:9px 15px;white-space:nowrap;font-size:.85rem;border:1px solid var(--line)}
.pills button.on{color:var(--acc)}
.detail h3{margin:18px 0 8px;font-size:1.02rem}.detail h3 small{font-weight:400;color:var(--tx2);font-size:.78rem;margin-left:6px}
.dd{display:flex;gap:8px}.dd button{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:.85rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips button{flex:none;min-width:44px;height:42px;padding:0 12px;border-radius:10px;background:var(--sf2);font-weight:500}
.chips button.on{background:rgba(var(--acc-rgb),.25);color:color-mix(in srgb,var(--acc) 70%,var(--tx));box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.5)}
.dtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:6px}
.dtabs button{padding:10px 0;font-weight:600;color:var(--tx2);position:relative;font-size:.95rem}.dtabs button.on{color:var(--tx)}
.dtabs button.on::after{content:"";position:absolute;left:0;width:100%;bottom:-1px;height:3px;border-radius:3px;background:var(--acc)}
.detail .grid{padding:12px 0}.detail .card p{font-size:.74rem}
.fab{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding:12px 26px;border-radius:99px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 50%,#7ff));color:#fff;font-weight:600;box-shadow:0 10px 28px rgba(var(--acc-rgb),.45)}
.detail.off .fab{display:none}.detail.isfs .fab{display:none}
.erow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--sf);margin-bottom:8px}.erow b{flex:1;font-weight:500}.erow small{color:var(--tx2)}
.erow.on{box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.6)}
.cm{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.cm i{width:30px;height:30px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;font-style:normal;font-size:.8rem;flex:none}.cm b{font-size:.8rem}.cm p{margin:2px 0 0}
.cin{display:flex;gap:8px;margin-top:12px}.cin input{flex:1;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;color:var(--tx)}
/* downloads */
.dlrow{display:flex;gap:12px;padding:10px 14px;align-items:center}
.dlrow img{width:60px;aspect-ratio:3/4.1;border-radius:10px;object-fit:cover}.dlrow .inf{flex:1;min-width:0}
.dlrow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dlrow small{color:var(--tx2)}
.bar{height:5px;border-radius:9px;background:var(--sf2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
/* me */
.prof{display:flex;align-items:center;gap:14px;padding:16px;margin:8px 14px;background:var(--sf);border-radius:20px;border:1px solid var(--line)}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#c4b5fd);display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:#fff;overflow:hidden;cursor:pointer;position:relative;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.prof .n{flex:1;min-width:0}.prof b{font-size:1.1rem;display:block}.prof small{color:var(--tx2)}
.grp{margin:16px 14px 0}.grp h4{margin:0 0 6px 4px;font-size:.82rem;color:var(--tx2);font-weight:500}
.box{background:var(--sf);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border-bottom:0}
.row em{font-style:normal;color:var(--tx2);font-size:.85rem}
.row.act span{color:#ff7a8a}
.sw{width:42px;height:24px;border-radius:99px;background:var(--sf2);position:relative;transition:background .2s;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
.sws{display:flex;gap:10px}.sws button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}.sws button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
/* chat */
.chatw{display:flex;flex-direction:column;height:100%}.msgs{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.bub{max-width:78%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--sf2)}.bub.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--acc);color:#fff}.bub small{display:block;font-size:.66rem;opacity:.7;margin-bottom:2px}
.note{margin:0 14px 6px;font-size:.74rem;color:var(--tx2)}
.chatw .cin{padding:8px 14px 12px;margin:0}
/* upload */
.upb{display:flex;gap:10px;padding:10px 14px}.upb button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;background:var(--sf);border:1px solid var(--line);font-weight:600}
.upb button:first-child{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#fff));color:#fff;border:0}
/* sheets/modals */
.shw{position:absolute;inset:0;z-index:300;display:flex;flex-direction:column;justify-content:flex-end}
.shb{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fd .2s}@keyframes fd{from{opacity:0}}
.sh{position:relative;background:var(--sf);border-radius:22px 22px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:sl .25s cubic-bezier(.2,.9,.3,1);max-height:75%;overflow-y:auto}
@keyframes sl{from{transform:translateY(100%)}}
.shw.out .sh{transform:translateY(100%);transition:transform .2s}.shw.out .shb{opacity:0;transition:opacity .2s}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sh h4{margin:4px 4px 2px;font-size:1.05rem}.sh .sub{padding:0 4px 8px}
.shi{display:flex;align-items:center;gap:8px;width:100%;padding:14px 8px;border-bottom:1px solid var(--line);text-align:left}.shi:last-child{border:0}
.shi span{flex:1}.shi em{font-style:normal;color:var(--tx2);font-size:.82rem}.shi.on{color:var(--acc)}
.modal{position:absolute;inset:0;z-index:250;background:var(--bg);display:flex;flex-direction:column;animation:up .25s ease}
.mh{display:flex;align-items:center;gap:8px;padding:10px 10px;border-bottom:1px solid var(--line);font-size:1.05rem}
.mbody{flex:1;overflow-y:auto;padding:12px 16px 30px}
.fl{display:block;margin:16px 0 6px;font-size:.8rem;color:var(--tx2)}
.inp{width:100%;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);outline:0}.inp[disabled]{opacity:.6}
.cvrow{display:flex;gap:12px;align-items:center}.cvp{width:84px;aspect-ratio:3/4.1;border-radius:12px;background:var(--sf2) center/cover;display:grid;place-items:center;font-size:.7rem;color:var(--tx2);flex:none}
.stack{display:grid;gap:8px}.btn2{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.85rem}
.where{margin-top:16px;padding:10px 12px;border-radius:12px;background:rgba(var(--acc-rgb),.16);font-weight:600}
.drop{width:100%;padding:16px;border:1.5px dashed rgba(var(--acc-rgb),.6);border-radius:14px;color:var(--tx2);word-break:break-all}
.link{color:var(--acc);font-size:.82rem;margin-top:8px}.orig{margin-top:8px;font-size:.82rem;color:var(--tx2)}
.qrow{display:flex;gap:8px;flex-wrap:wrap}.qc{padding:9px 16px;border-radius:10px;background:var(--sf2)}.qc.on{background:rgba(var(--acc-rgb),.3);box-shadow:inset 0 0 0 1px var(--acc)}.qc[disabled]{opacity:.35;text-decoration:line-through}
.prog{margin-top:14px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:900;background:rgba(30,22,48,.96);color:#fff;padding:10px 16px;border-radius:99px;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tt .25s;max-width:88%;text-align:center}
@keyframes tt{from{opacity:0;transform:translate(-50%,10px)}}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mchips button{padding:8px 12px;border-radius:10px;background:var(--sf2);font-size:.85rem}.mchips button.dim{opacity:.6}

/* v2 additions */
.detail{transform-origin:var(--ox,50%) var(--oy,50%);animation:zi .32s cubic-bezier(.2,.9,.3,1)}
@keyframes zi{from{transform:scale(.86);opacity:0}}
.stage.pa{animation:sp .3s cubic-bezier(.2,.9,.3,1)}@keyframes sp{from{transform:scale(.94);opacity:.4}}
.content.pa2{animation:fu .24s ease}@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.nav button.on svg{animation:bn .35s cubic-bezier(.2,1.5,.4,1)}@keyframes bn{from{transform:scale(.7)}}
button:active{transform:scale(.96)}.row:active,.shi:active,.erow:active{background:rgba(var(--acc-rgb),.14)}
.card,.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.buf{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:2;color:#fff;text-align:center}
.buf.on{display:grid}.buf .sp{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--acc);animation:spin .8s linear infinite;margin:0 auto 8px}
.buf small{text-shadow:0 1px 6px #000}@keyframes spin{to{transform:rotate(360deg)}}
.stage video{display:block;background:transparent}
.chatpage{display:flex;flex-direction:column;height:100%}.chatpage .host{flex:1;min-height:0;display:flex;flex-direction:column}
.host .msgs{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.host .cin{padding:8px 14px 12px;margin:0}
.cmb .msgs{overflow:visible;padding:8px 0;flex:none}.cmb .cin{padding:8px 0 0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}.msg.me{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--sf2);display:grid;place-items:center;font-style:normal;font-size:.85rem;font-weight:600;flex:none;color:var(--tx)}
.bub{max-width:78%;padding:8px 12px 9px;border-radius:16px 16px 16px 4px;background:var(--sf2);align-self:auto;word-break:break-word}
.bub.me{border-radius:16px 16px 4px 16px;background:var(--acc);color:#fff}
.bub small{display:flex;gap:6px;align-items:center;font-size:.68rem;opacity:.85;margin-bottom:3px;flex-wrap:wrap}.bub small b{font-weight:600}
.bub p{margin:0;white-space:pre-wrap}.bub .ed{font-style:italic;opacity:.8}.bub.del{opacity:.6;border:1px dashed var(--line)}.bub .dn{font-size:.7rem;display:block;margin-bottom:2px}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sf);margin-bottom:8px}.frow div{flex:1;min-width:0}.frow b{display:block}.frow small{color:var(--tx2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frow button{padding:6px 10px;border-radius:8px;background:var(--sf2);font-size:.8rem}
.pill-red{color:#ff7a8a!important}
.lock .sh{pointer-events:auto}

.player.fs .stage.vready .art{display:none}
.player.fs .stage{background:radial-gradient(circle at 50% 50%,#2a2a2f 0%,#101012 55%,#000 100%)}
.feeds{gap:18px;overflow-x:auto;scrollbar-width:none}.feeds::-webkit-scrollbar{display:none}.feeds button{white-space:nowrap}
.epsh{min-height:48%}.ephd{display:flex;justify-content:space-between;align-items:center;padding:2px 0 12px;border-bottom:1px solid var(--line)}
.ephd .btn2{display:flex;align-items:center;gap:6px}
.epg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:14px 0 6px}
.epb{height:46px;border-radius:10px;background:var(--sf2);font-weight:500}
.epb.on{background:linear-gradient(135deg,rgba(var(--acc-rgb),.55),rgba(var(--acc-rgb),.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.7)}


/* big screens: tablet / laptop / desktop use the full window */
@media (min-width:760px){
  #app{max-width:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 14px;padding:14px 22px 28px}
  .hdr{padding:0 22px}.search{padding:6px 22px;max-width:760px;margin:0 auto}.feeds{padding:8px 22px 0}
  h2.pt,.sub{padding-left:22px;padding-right:22px}
  .prof,.grp,.upb{max-width:780px;margin-left:auto;margin-right:auto}
  .dlrow,.chatpage{max-width:900px;margin-left:auto;margin-right:auto;width:100%}
  .shw .sh{width:560px;max-width:100%;margin:0 auto}
  .modal .mbody,.modal .mh{max-width:720px;margin-left:auto;margin-right:auto;width:100%}
  .epg{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}
  .card:hover .cv{transform:translateY(-3px)}
  .dscroll{padding-left:22px;padding-right:22px}
}
@media (min-width:980px){
  .detail{flex-direction:row}
  .detail .player{flex:0 0 64%;width:64%;align-self:flex-start}
  .detail .dscroll{flex:1;height:100%;padding:18px 22px 40px}
  .detail .player.fs{width:100%;height:100%;flex:none}
}
@media (min-width:1500px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}

.volp{position:absolute;right:44px;bottom:54px;background:rgba(0,0,0,.72);padding:10px 14px;border-radius:99px;display:none;z-index:3}
.ctl.volopen .volp{display:block}.volp input{width:130px;accent-color:var(--acc);display:block}
video::cue{background:rgba(0,0,0,.65);color:#fff;font-size:1.15em}

/* v2.3 */
.stage video{opacity:0;transition:opacity .25s}.stage.vready video{opacity:1}
.cmid .big{position:relative}
.cmid .big::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid transparent;border-top-color:var(--acc);border-right-color:rgba(255,255,255,.35);animation:spin .8s linear infinite;opacity:0;transition:opacity .15s;pointer-events:none}
.stage.buffering .cmid .big::after{opacity:1}
.volw{position:relative;display:inline-flex}
.volw .volp{right:-6px;bottom:calc(100% + 10px);left:auto}
.qbtn{padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.16);font-size:.72rem;font-weight:600;color:#fff;min-width:44px}
.player.fs .qbtn{display:none}
.langs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none}.langs:empty{display:none}.langs::-webkit-scrollbar{display:none}
.langs button{flex:none;padding:7px 14px;border-radius:99px;background:var(--sf2);font-size:.85rem}
.langs button.on{background:rgba(var(--acc-rgb),.3);box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.7);font-weight:600}
@keyframes lpop{from{transform:scale(.45) rotate(-14deg);opacity:0}}
@keyframes lglow{from{filter:drop-shadow(0 0 16px rgba(168,85,247,.45))}to{filter:drop-shadow(0 0 44px rgba(200,90,255,.95))}}
.logo.ls{animation:lpop .9s cubic-bezier(.2,1.3,.4,1) both,lglow 2.4s ease-in-out .9s infinite alternate}
@media (min-width:760px){.langs{padding:10px 22px 0}}

@keyframes lbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.logo.ls{animation:lpop .9s cubic-bezier(.2,1.3,.4,1) both,lglow 2.4s ease-in-out .9s infinite alternate,lbeat 2.4s ease-in-out .9s infinite}

    const dir=await opfs();const fh=await dir.getFileHandle(dlFile(d),{create:true});
    d.got=Math.min((await fh.getFile()).size,d.size);
    w=await fh.createWritable({keepExistingData:true});
    const r=await fetch(API+'/api/video?f='+encodeURIComponent(d.name)+'&t='+encodeURIComponent(TOKEN),{headers:d.got?{Range:'bytes='+d.got+'-'}:{},signal:ac.signal});
    if(r.status===403||r.status===401){kick();throw new Error('auth')}
    if(r.status===200&&d.got>0){await w.truncate(0);d.got=0}
    else if(r.status!==200&&r.status!==206)throw new Error('http '+r.status);
    await w.seek(d.got);
    const rd=r.body.getReader();let lastUi=0,sinceCommit=0;
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      await w.write(value);d.got+=value.length;sinceCommit+=value.length;
      if(sinceCommit>16*1048576){await w.close();w=await fh.createWritable({keepExistingData:true});await w.seek(d.got);sinceCommit=0;saveDl()}
      const now=Date.now();if(now-lastUi>400){lastUi=now;if(S.tab==='downloads')drawDownloads()}
    }
    await w.close();w=null;d.done=true;d.got=d.size;toast('Downloaded · '+(ser(d.id)?ser(d.id).title:'')+' E'+d.n);
  }catch(e){
    if(w){try{await w.close()}catch(x){}}
    if(!(e&&e.name==='AbortError')){d.paused=true;d.err=navigator.onLine?'Failed. Tap resume.':'Waiting for network'}
  }finally{delete DLC[key];saveDl();drawNav();if(S.tab==='downloads')drawDownloads()}
}

async function chatPoll(sc){
  const c=chatState(sc);const r=await api('/api/chat?scope='+encodeURIComponent(sc)+'&after='+c.after+'&since='+c.since);c.since=r.now;let ch=0;
  for(const m of r.msgs){

    if(m.tomb){if(i>=0){c.msgs.splice(i,1);ch++}continue}

function putPart(fileId,n,buf,sha,onP){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open('PUT',API+'/api/upload/part?fileId='+encodeURIComponent(fileId)+'&n='+n);
    x.setRequestHeader('Authorization','Bearer '+TOKEN);x.setRequestHeader('X-Sha1',sha);x.timeout=600000;
    x.upload.onprogress=e=>onP(e.loaded);
    x.onload=()=>{if(x.status===200)res();else{let j={};try{j=JSON.parse(x.responseText)}catch(e){}rej({status:x.status,error:j.error||'Part failed'})}};
    x.onerror=()=>rej({offline:true});x.ontimeout=()=>rej({offline:true});x.send(buf);
  });
}

async function uploadFile(file,onProgress){
  const rk='strm.up.'+file.name+'.'+file.size;let st=store.get(rk,null),have=[];
  if(st){try{have=await api('/api/upload/parts?fileId='+encodeURIComponent(st.fileId))}catch(e){if(e&&e.offline)throw e;st=null;have=[]}}
  if(!st){const r=await api('/api/upload/start',{json:{name:file.name,size:file.size}});st={fileId:r.fileId,fileName:r.fileName};store.set(rk,st);have=[]}
  const CHN=file.size<=8388608?5000000:8388608,total=Math.ceil(file.size/CHN),sha1s=[];
  for(let n=1;n<=total;n++){
    const buf=await file.slice((n-1)*CHN,n*CHN).arrayBuffer();const sha=hex(await crypto.subtle.digest('SHA-1',buf));
    const ex=have.find(p=>p.n===n);
    if(ex&&ex.sha1===sha){sha1s.push(sha);onProgress((n-1)*CHN+buf.byteLength);continue}
    let ok=false,lastErr=null;
    for(let t=0;t<6&&!ok;t++){
      try{await putPart(st.fileId,n,buf,sha,l=>onProgress((n-1)*CHN+l));ok=true}
      catch(e){lastErr=e;if(e&&e.status===403){kick();throw e}if(e&&e.status&&e.status<500&&e.status!==408)throw e;await new Promise(r=>setTimeout(r,2000*(t+1)))}
    }
    if(!ok)throw lastErr||{error:'Upload failed'};
    sha1s.push(sha);
  }
  await api('/api/upload/finish',{json:{fileId:st.fileId,sha1s}});store.del(rk);

}

let lpT=0;const lp={t:0,x:0,y:0};
document.addEventListener('pointerdown',e=>{
  clearTimeout(lp.t);const msg=e.target.closest('.msg'),cd=e.target.closest('.card[data-act="open"]');if(!msg&&!cd)return;
  lp.x=e.clientX;lp.y=e.clientY;lp.t=setTimeout(()=>{lpT=Date.now();if(msg)msgMenu(+msg.dataset.mid);else cardMenu(+cd.dataset.id)},520);
},{passive:true});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lp.t)));
document.addEventListener('pointermove',e=>{if(lp.t&&(Math.abs(e.clientX-lp.x)>10||Math.abs(e.clientY-lp.y)>10))clearTimeout(lp.t)},{passive:true});
document.addEventListener('scroll',()=>clearTimeout(lp.t),true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.msg,.card'))e.preventDefault()});
const ACT={
  open:t=>{if(Date.now()-lpT<700)return;const id=+t.dataset.id;if(S.tab==='upload'&&!$('#detail')){manage(id);return}openDetail(id,{from:t})},
  lang:t=>{S.lang=t.dataset.v;store.set('strm.lang',S.lang);const e=$('#langs');if(e)e.innerHTML=langChips();drawGrid()},
  feed:t=>{S.feed=t.dataset.v;S.q='';drawHome()},
  dosearch:()=>{const i=$('#q');i&&i.focus();drawGrid()},
  nav:t=>go(t.dataset.v),
  'p-play':()=>{const v=V();v.paused?v.play().catch(()=>{}):v.pause()},
  'p-skip':t=>PL.skip(+t.dataset.v),
  'p-back':()=>{if($('#pl').classList.contains('fs'))fsToggle(false);else closeDetail()},
  'p-fs':()=>fsToggle(),
  'p-vol':()=>{const c=$('#ctl');c.classList.toggle('volopen');showCtl(4000)},
  'p-q':()=>{const ep=epObj(cur(),D.s,D.n),fs=(ep.files||{})[D.lang]||{},qs=D.offline?[D.q]:epQs(ep,D.lang);
    const items=qs.map(q=>({t:q+'p',v:q,on:q===PL.q}));
    const enc=!D.offline&&ep.enc&&Date.now()-ep.enc.ts<3*3600e3?ep.enc.q:[];
    enc.filter(q=>!qs.includes(q)).sort((a,b)=>b-a).forEach(q=>items.push({t:q+'p',s:'Processing…',v:0}));
    if(S.kind==='dev'&&!D.offline)(ep.want||[]).filter(q=>!qs.includes(q)&&!enc.includes(q)).sort((a,b)=>b-a).forEach(q=>items.push({t:q+'p',s:'Not generated yet (only you see this)',v:0}));
    sheet('Quality',items,it=>{if(it.v&&it.v!==PL.q)switchQ(it.v)})},
  'p-dl':()=>dlSheet(D.n),
  'p-lang':()=>ACT['d-lang'](),
  'p-sub':()=>{const ep=epObj(cur(),D.s,D.n),subs=ep.subs||[];if(D.offline){toast('Subtitles need an internet connection');return}if(!subs.length){toast('No subtitles for this video');return}
    sheet('Subtitles',[{t:'Off',v:'',on:!PL.sub},...subs.map(x=>({t:x.lang,v:x.lang,on:PL.sub===x.lang}))],it=>setSub(it.v))},
  'p-ratio':()=>sheet('Aspect ratio',RATIOS.map(([v,t,s])=>({t,s,v,on:PL.ratio===v})),it=>{PL.ratio=it.v;S.set.ratio=it.v;saveSet();const l=$('#rtl');if(l)l.textContent=ratioLabel(it.v);applyRatio();showCtl()}),
  'p-speed':()=>sheet('Playback speed',SPEEDS.map(x=>({t:x+'×',v:x,on:x===PL.base})),it=>{PL.base=it.v;V().playbackRate=it.v;pui()}),
  addpl:()=>{const i=S.playlist.indexOf(D.id);if(i<0){S.playlist.push(D.id);toast('Added to Playlist')}else{S.playlist.splice(i,1);toast('Removed from Playlist')}store.set('strm.pl',S.playlist);drawDetail()},
  'd-dl':()=>dlSheet(D.n),
  'd-epdl':t=>dlSheet(+t.dataset.v),
  'd-del':()=>{const s=cur(),n=D.n,si=D.s;sheet('Delete',[{t:'Delete this episode (EP '+n+')',v:'ep'},{t:'Delete whole series',v:'all'}],it=>{
    if(it.v==='ep')confirmDelete('Delete EP '+n+'?','Video files of this episode',()=>deleteEpisode(s.id,si,n));
    else confirmDelete('Delete "'+s.title+'"?','All seasons, episodes and video files',()=>deleteSeries(s.id))})},
  'd-lang':()=>{const ep=epObj(cur(),D.s,D.n);if(D.offline)return;sheet('Language',epLangs(ep).map(l=>({t:l,on:l===D.lang})),it=>{if(it.t!==D.lang)switchLang(it.t)})},
  'd-season':()=>{const s=cur();sheet('Season',s.seasons.map((se,i)=>({t:'Season '+pad(i+1),s:se.eps.length+' episodes',v:i+1,on:i+1===D.s})),it=>{if(it.v===D.s)return;D.s=it.v;const e0=[...s.seasons[D.s-1].eps].sort((a,b)=>a.n-b.n)[0];D.n=e0.n;D.chip=e0.n;const ls=epLangs(e0);if(!ls.includes(D.lang))D.lang=ls[0];loadEp();drawDetail()})},
  'd-chip':t=>{const v=t.dataset.v;if(v==='all'){epPopup();return}else{D.n=+v;D.chip=+v;const ls=epLangs(epObj(cur(),D.s,D.n));if(!ls.includes(D.lang))D.lang=ls[0];loadEp()}drawDetail()},
  'd-ep':t=>{D.n=+t.dataset.v;const ls=epLangs(epObj(cur(),D.s,D.n));if(!ls.includes(D.lang))D.lang=ls[0];loadEp();drawDetail()},
  'd-tab':t=>{D.tab=t.dataset.v;drawDetail()},
  'd-info':()=>{const s=cur(),ep=epObj(s,D.s,D.n);sheet('About '+s.title,[{t:'Categories',s:(s.cats||[]).join(', ')},{t:'Year',s:String(s.year||'')},{t:'Languages',s:(s.langs||[]).join(', ')},{t:'This episode',s:epQs(ep,D.lang).map(q=>q+'p').join(', ')},{t:'Seasons',s:String(s.seasons.length)}],()=>{})},
  'dl-play':async t=>{const d=S.downloads.find(x=>x.key===t.dataset.key);if(!d)return;try{openDetail(d.id,{s:d.s,n:d.n,q:d.q,lang:d.lang,localUrl:await dlUrl(d)})}catch(e){toast('File not found. Download it again.')}},
  'dl-pause':t=>{const d=S.downloads.find(x=>x.key===t.dataset.key);if(!d)return;if(d.paused){runDl(d.key)}else{d.paused=true;abortDl(d.key)}saveDl();drawDownloads()},
  'dl-del':t=>{const d=S.downloads.find(x=>x.key===t.dataset.key);if(!d)return;abortDl(d.key);rmFile(d);S.downloads=S.downloads.filter(x=>x!==d);saveDl();drawDownloads();drawNav()},
  'chat-send':async()=>{if(!MOUNT)return;const i=$('input',MOUNT.host),v=i.value.trim();if(!v)return;i.value='';try{await api('/api/chat',{json:{scope:MOUNT.scope,text:v,name:S.set.name}});await chatTick();paintMsgs(true)}catch(e){i.value=v;toast(e&&e.offline?'No internet':((e&&e.error)||'Could not send'))}},
  tg:t=>{const k=t.dataset.k;S.set[k]=!S.set[k];saveSet();applySettings();drawMe()},
  pk:t=>{const k=t.dataset.k,row=SETS.flatMap(g=>g[1]).find(x=>x[0]===k);sheet(row[1],row[3].map(([v,l])=>({t:l,v,on:String(S.set[k])===String(v)})),it=>{S.set[k]=it.v;saveSet();applySettings();drawMe()})},
  acc:t=>{S.set.accent=t.dataset.v;saveSet();applySettings();drawMe()},
  photo:()=>$('#photoin').click(),
  editname:()=>ask('Display name',S.set.name,v=>{S.set.name=v;saveSet();store.set('strm.named',true);syncProfile();drawMe()}),
  mode:()=>{S.mode=S.mode==='dev'?'customer':'dev';store.set('strm.mode',S.mode);if(S.tab==='upload')S.tab='me';drawNav();drawMe();toast(S.mode==='dev'?'Developer mode on':'Customer mode on')},
  ckeys:keysModal,
  logout:()=>{wipe();store.del('strm.mode');S.mode='customer';renderGate()},
  act:t=>{const k=t.dataset.k;
    if(k==='_clrdl'){S.downloads.forEach(d=>{abortDl(d.key);rmFile(d)});S.downloads=[];saveDl();drawMe();drawNav();toast('Downloads deleted')}
    else if(k==='_cache')toast('Cache cleared');
    else if(k==='_reset'){S.set=Object.assign({},DEF,{name:S.set.name,photo:S.set.photo});saveSet();applySettings();drawMe();toast('Settings reset')}},
  dstorage:async()=>{try{toast('Checking…');const r=await api('/api/storage');sheet('Server storage',[{t:'Videos stored',s:(r.bytes/1073741824).toFixed(2)+' GB · '+r.files+' files'},{t:'Unfinished uploads',s:r.unfinished+' · '+mb(r.unfinishedBytes||0)+' MB'},{t:'Free limit',s:'10 GB (Backblaze)'}],()=>{})}catch(e){toast((e&&e.error)||'Could not check')}},
  dclean:()=>sheet('Cancel unfinished uploads?',[{t:'Cancel them now',s:'Do not do this while an upload is running',v:1},{t:'Keep',v:0}],async it=>{if(!it.v)return;try{const r=await api('/api/upload/cleanup',{method:'POST'});toast('Cancelled '+r.cancelled+' unfinished upload'+(r.cancelled===1?'':'s'))}catch(e){toast((e&&e.error)||'Failed')}}),
  hist:historyModal,
  notif:async()=>{if(typeof Notification==='undefined'){toast('Notifications are not supported here');return}if(Notification.permission==='denied'){toast('Notifications are blocked. Allow them in the browser settings.');return}try{await Notification.requestPermission()}catch(e){}drawMe()},
  apk:()=>{location.href=APK_FILE+'?v='+Date.now()},
  'up-new':()=>uploadForm('new'),
  'up-next':nextSeason
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||!t.dataset.act)return;const f=ACT[t.dataset.act];f&&f(t,e)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;drawGrid()}});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter')e.target.blur();if(MOUNT&&e.key==='Enter'&&e.target.closest('.cin'))ACT['chat-send']()});
document.addEventListener('change',e=>{if(e.target.id!=='photoin')return;const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d');const r=Math.max(120/img.width,120/img.height);x.drawImage(img,(120-img.width*r)/2,(120-img.height*r)/2,img.width*r,img.height*r);S.set.photo=c.toDataURL('image/jpeg',.8);saveSet();syncProfile();drawMe()};img.src=URL.createObjectURL(f)});
const offUI=()=>{const o=$('#offchip');if(o)o.style.display=navigator.onLine?'none':'block';toast(navigator.onLine?'Back online':'You are offline. Downloads still play.')};
addEventListener('online',offUI);addEventListener('offline',offUI);
/* ---------- boot ---------- */
applySettings();splash();wake();
if(!isApp())checkApk().then(()=>setTimeout(installPopup,3800));
setTimeout(checkUpdate,6000);setInterval(checkUpdate,600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
loadConfig().then(()=>{
  const un=store.get('strm.unlock',null);
  if(TOKEN&&un&&un.kind){S.kind=un.kind;S.tag=un.tag||'';S.mode=un.kind==='dev'?store.get('strm.mode','dev'):'customer';renderMain();startBg();pollMe()}else renderGate();
});
if('serviceWorker' in navigator&&!window.Capacitor&&location.protocol.indexOf('http')===0&&window.__SW)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
</body>
